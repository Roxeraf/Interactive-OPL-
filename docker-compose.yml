services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: klarpunkt:local
    container_name: klarpunkt
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: file:/data/klarpunkt.db
      AUTH_SECRET: ${AUTH_SECRET:-klarpunkt-docker-local-secret-bitte-ersetzen}
      UPLOAD_DIR: /data/uploads
    volumes:
      - klarpunkt-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  klarpunkt-data:
